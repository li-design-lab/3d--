<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蓝色 3D 地图 · 公路资产</title>
  <meta name="description" content="蓝色立体地图，支持昌都 G214 卡若段真实里程桩与桥梁数据、雷达反射率、行政区下钻、地球视图和自由视角。">
  <link rel="stylesheet" href="style.css?v=4e26be6f9bfc05ad96277602e1c84d3efe21c59c">
  <link rel="stylesheet" href="regions.css?v=4e26be6f9bfc05ad96277602e1c84d3efe21c59c">
  <link rel="stylesheet" href="road.css?v=4e26be6f9bfc05ad96277602e1c84d3efe21c59c">
  <script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
</head>
<body>
  <main id="scene" aria-label="三维地图，拖动旋转，滚轮缩放"></main>
  <div id="labels"></div>
  <div id="transition"></div>
  <button id="back" class="back" hidden>‹ 返回上一级</button>
  <section id="region-nav" aria-label="行政区下钻导航">
    <nav id="region-crumbs" aria-label="当前位置"></nav>
    <select id="region-select" aria-label="选择下钻区域"></select>
    <p id="region-status" role="status"></p>
    <small id="release-label">下钻版 · 4e26be6</small>
  </section>
  <button id="road-entry" data-view="road" aria-pressed="false"><strong>公路</strong><span>昌都 · 公路资产</span><span>↗</span></button>

  <div class="tools left" aria-label="数据图层">
    <div class="tools-caption">图层显示</div>
    <button data-layer="radar" aria-pressed="true" class="active"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15c2-4 4-6 7-6s5 2 7 6M7 10c1.5-2.5 3.1-3.7 5-3.7s3.5 1.2 5 3.7"/><circle cx="12" cy="16" r="1.2"/></svg><span class="control-label">雷达回波</span></button>
    <button data-layer="fly" aria-pressed="true" class="active"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17C7 3 15 3 21 10M3 17h5m-5 0v-5"/><circle cx="20" cy="10" r="1.5"/></svg><span class="control-label">柱子飞线</span></button>
    <button data-layer="event" aria-pressed="true" class="active"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12l4 4v10H4z"/><path d="M8 10h5m-5 4h8"/></svg><span class="control-label">事件标签</span></button>
    <button data-layer="point" aria-pressed="true" class="active"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V9h3v10m4 0V4h3v15m4 0v-7h3v7M3 20h19"/></svg><span class="control-label">重点点位</span></button>
    <button data-layer="heat" aria-pressed="false"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 6-3 6 3 6-3v13l-6 3-6-3-6 3zM9 4v13m6-10v13"/></svg><span class="control-label">模拟热力</span></button>
    <button data-layer="scatter" aria-pressed="true" class="active"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c3-5 5 4 8-1s5 3 10-2M3 20h18"/><path d="m8 10 4-6 4 6z"/></svg><span class="control-label">地图散点</span></button>
    <button data-layer="aura" aria-pressed="true" class="active" hidden><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/><circle cx="12" cy="12" r="6"/></svg><span class="control-label">粒子光环</span></button>
  </div>

  <div class="tools right" aria-label="视角控制">
    <div class="tools-caption">视角控制</div>
    <button id="in"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7.5 10.5h6m-3-3v6"/></svg><span class="control-label">放大</span></button>
    <button id="out"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7.5 10.5h6"/></svg><span class="control-label">缩小</span></button>
    <button id="top"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span class="control-label">俯视</span></button>
    <button id="orbit" aria-pressed="false"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8a8 8 0 0 0-14-2L3 9m0-5v5h5M4 16a8 8 0 0 0 14 2l3-3m0 5v-5h-5"/></svg><span class="control-label">环绕</span></button>
    <button id="reset"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span class="control-label">复位</span></button>
  </div>

  <div id="tooltip" hidden></div>
  <nav class="tabs" data-active="china" aria-label="场景切换">
    <button data-view="earth" aria-pressed="false"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span>全球</span></button>
    <button data-view="china" class="selected" aria-pressed="true"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 6-3 6 3 6-3v13l-6 3-6-3-6 3zM9 4v13m6-10v13"/></svg><span>中国</span></button>
    <button data-view="road" aria-pressed="false"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m7 3-3 18M17 3l3 18M12 3v4m0 3v4m0 3v4"/></svg><span>公路</span></button>
  </nav>
  <aside class="radar-panel" aria-label="雷达产品信息">
    <div class="radar-head"><span class="radar-dot"></span><span>雷达拼图 · 实况</span></div>
    <strong>组合反射率 <small>CREF / dBZ</small></strong>
    <div class="radar-time">2026-08-26&nbsp; 00:54–02:12</div>
    <div class="radar-scale" aria-hidden="true"></div>
    <div class="radar-ticks"><span>5</span><span>15</span><span>25</span><span>35</span><span>45+</span></div>
    <p>覆盖范围 73–135°E · 最大 44.4 dBZ</p>
  </aside>
  <div class="hint">拖动旋转 · 滚轮缩放 · 点击区域下钻</div>
  <div class="meta">3D GEO VISUALIZATION <span>CREF 雷达实况</span></div>
  <button id="fullscreen" title="全屏" aria-label="全屏"><svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button>
  <div id="loading"><div class="loader"></div><span>正在构建立体地图</span><button id="retry" hidden>重新加载</button></div>
  <div id="notice" role="status"></div>
  <script type="module" src="app.js?v=4e26be6f9bfc05ad96277602e1c84d3efe21c59c"></script>
</body>
</html>
